- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - unzip
      - ca-certificates
      - htop
      - jq
      - chrony
    state: present
  become: true

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  become: true

