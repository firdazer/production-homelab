---
- name: Verify control-plane node address
  ansible.builtin.assert:
    that:
      - ansible_default_ipv4.address == "192.168.100.31"
    fail_msg: "Unexpected control-plane IP. Installation stopped."

- name: Check whether K3s server is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_server_binary

- name: Report K3s installation status
  ansible.builtin.debug:
    msg: "K3s binary present: {{ k3s_server_binary.stat.exists }}"

- name: Download official K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/install-k3s.sh
    mode: "0755"
    owner: root
    group: root

- name: Download K3s AMD64 checksums
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/sha256sum-amd64.txt"
    dest: /usr/local/src/k3s-sha256sum-amd64.txt
    mode: "0644"

- name: Read official K3s checksums
  ansible.builtin.slurp:
    src: /usr/local/src/k3s-sha256sum-amd64.txt
  register: k3s_checksums

- name: Extract K3s binary checksum
  ansible.builtin.set_fact:
    k3s_binary_sha256: >-
      {{
        (
          k3s_checksums.content
          | b64decode
          | regex_findall('(?m)^([a-fA-F0-9]{64})\s+\*?k3s\s*$')
        ) | first | default('')
      }}

- name: Ensure official K3s binary checksum exists
  ansible.builtin.assert:
    that:
      - k3s_binary_sha256 | length == 64
    fail_msg: "Unable to identify K3s AMD64 checksum. Installation stopped."

- name: Download and verify pinned K3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s"
    dest: /usr/local/src/k3s-verified
    checksum: "sha256:{{ k3s_binary_sha256 }}"
    mode: "0755"

- name: Install verified K3s binary
  ansible.builtin.copy:
    src: /usr/local/src/k3s-verified
    dest: /usr/local/bin/k3s
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Configure K3s control plane
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      node-ip: "192.168.100.31"
      advertise-address: "192.168.100.31"
      tls-san:
        - "192.168.100.31"
      write-kubeconfig-mode: "0600"
      secrets-encryption: true
      disable:
        - servicelb

- name: Create K3s server systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=K3s Kubernetes Server
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=notify
      ExecStart=/usr/local/bin/k3s server
      KillMode=process
      Delegate=yes
      Restart=always
      RestartSec=5s
      LimitNOFILE=1048576
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target
  register: k3s_service_unit

- name: Enable and start K3s control plane
  ansible.builtin.systemd_service:
    name: k3s
    daemon_reload: true
    enabled: true
    state: started
