- name: Join K3s worker nodes
  hosts: k3s_workers
  become: true

  pre_tasks:
    - name: Read K3s node token from control plane
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: k3s-cp01
      register: k3s_join_token_file
      no_log: true

    - name: Store token for worker configuration
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_join_token_file.content | b64decode | trim }}"
      no_log: true

  roles:
    - k3s_agent
