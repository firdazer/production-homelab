name: Container Build

on:
  push:
    branches: [main]
    paths:
      - "apps/web-demo/**"
      - ".github/workflows/container-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish web-demo
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for security scanning
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-demo
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.0/contrib/install.sh -o /tmp/install-trivy.sh
          bash /tmp/install-trivy.sh -b /tmp/trivy-bin v0.76.0
          /tmp/trivy-bin/trivy --version

      - name: Scan container image with Trivy
        run: |
          /tmp/trivy-bin/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"

      - name: Publish scanned image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
